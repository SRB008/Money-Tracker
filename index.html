<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fatal-error" class="hidden" style="max-width:600px;margin:60px auto;padding:20px;border:1px solid #d03b3b;border-radius:8px;color:#d03b3b;font-family:system-ui,sans-serif;"></div>

<!-- Signed-out view -->
<div id="auth-view" class="auth-wrap hidden">
  <div class="card">
    <h2 id="auth-title">Sign in</h2>
    <form id="auth-form">
      <div class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button type="submit" class="primary" id="auth-submit">Sign in</button>
      <div id="auth-msg" class="msg"></div>
    </form>
    <div class="auth-toggle">
      <span id="auth-toggle-text">Need an account?</span>
      <a id="auth-toggle-link">Sign up</a>
    </div>
  </div>
</div>

<!-- Signed-in view -->
<div id="app-view" class="wrap hidden">
  <header class="app-header">
    <nav class="tabs page-tabs">
      <a href="index.html" class="tab-btn active">Dashboard</a>
      <a href="investments.html" class="tab-btn">Investments</a>
      <a href="expenses.html" class="tab-btn">Expenses</a>
      <a href="debts.html" class="tab-btn">Debts</a>
    </nav>
    <div class="user-bar">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="stat-row" id="stat-row-accounts"></div>
  <div class="stat-row" id="stat-row-debt"></div>
  <div class="stat-row" id="stat-row-total"></div>

  <div class="card">
    <h2>Next 8 days</h2>
    <div class="expense-list-header">
      <span class="expense-date"></span>
      <span class="expense-name"></span>
      <span class="expense-amount">Amount</span>
      <span class="expense-running-total">Running total</span>
    </div>
    <div class="expense-list" id="next8-list"></div>
    <div id="next8-empty" class="empty hidden">Nothing due in the next 8 days.</div>
  </div>

</div>

<script>
  function showFatal(msg) {
    var el = document.getElementById('fatal-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  window.addEventListener('error', function (e) {
    showFatal('Something failed to load or run: ' + e.message + ' (' + (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + ')');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showFatal('Failed to load the Supabase library from cdn.jsdelivr.net — check your internet connection or whether an ad/script blocker is active.')"></script>
<script src="config.js" onerror="showFatal('Failed to load config.js')"></script>
<script src="dashboard.js" onerror="showFatal('Failed to load dashboard.js')"></script>
</body>
</html>
