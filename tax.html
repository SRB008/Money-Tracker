<link rel="stylesheet" href="style.css">
</head>
<body>

    </nav>
    <div class="user-bar">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="card">
    <h2>Add tax record</h2>
    <form id="tax-form">
      <div class="field">
        <label for="tax-date">Tax date</label>
        <input id="tax-date" type="date" required>
      </div>
      <div class="field">
        <label for="tax-amount">Gross amount (£)</label>
        <input id="tax-amount" type="number" step="0.01" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="tax-source">Source</label>
        <select id="tax-source" required></select>
      </div>
      <div class="field">
        <label for="tax-type">Type</label>
        <select id="tax-type" required>
          <option value="Savings Interest">Savings Interest</option>
          <option value="Dividends">Dividends</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="tax-live"><input id="tax-live" type="checkbox" checked> Live</label>
      </div>
      <div class="field">
        <label for="tax-notes">Notes</label>
        <input id="tax-notes" type="text">
      </div>
      <button type="submit" class="primary">Save</button>
    </form>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Tax records</h2>
    </div>
    <div style="overflow-x:auto">
      <table id="tax-table">
        <thead>
          <tr>
            <th>Tax date</th>
            <th class="value">Gross amount</th>
            <th>Source</th>
            <th>Type</th>
            <th>Live</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tax-body"></tbody>
      </table>
    </div>
  </div>

</div>

</script>
