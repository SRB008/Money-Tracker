<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fatal-error" class="hidden" style="max-width:600px;margin:60px auto;padding:20px;border:1px solid #d03b3b;border-radius:8px;color:#d03b3b;font-family:system-ui,sans-serif;"></div>

<div id="app-view" class="wrap hidden">
  <header class="app-header">
    <div class="admin-header-left">
      <h1 class="page-title">Admin</h1>
      <a href="index.html" class="back-link">&larr; Dashboard</a>
    </div>
    <div class="user-bar">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="card">
    <h2>Settings</h2>
    <div class="admin-setting-row">
      <label for="drawdown-rate" class="admin-setting-label">Pension Drawdown Rate</label>
      <div class="input-suffix-wrap">
        <input id="drawdown-rate" type="number" step="0.1" min="0" max="100">
        <span class="input-suffix">%</span>
      </div>
      <button type="button" class="primary" id="save-drawdown-btn">Save</button>
    </div>
    <div class="msg" id="drawdown-msg"></div>
  </div>

</div>

<script>
  function showFatal(msg) {
    var el = document.getElementById('fatal-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  window.addEventListener('error', function (e) {
    showFatal('Something failed to load or run: ' + e.message + ' (' + (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + ')');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showFatal('Failed to load the Supabase library from cdn.jsdelivr.net — check your internet connection or whether an ad/script blocker is active.')"></script>
<script src="config.js" onerror="showFatal('Failed to load config.js')"></script>
<script src="admin.js" onerror="showFatal('Failed to load admin.js')"></script>
</body>
</html>
