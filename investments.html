<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investments</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fatal-error" class="hidden" style="max-width:600px;margin:60px auto;padding:20px;border:1px solid #d03b3b;border-radius:8px;color:#d03b3b;font-family:system-ui,sans-serif;"></div>

<div id="app-view" class="wrap hidden">
  <header class="app-header">
    <nav class="tabs page-tabs">
      <a href="index.html" class="tab-btn">Dashboard</a>
      <a href="investments.html" class="tab-btn active">Investments</a>
      <a href="expenses.html" class="tab-btn">Expenses</a>
      <a href="debts.html" class="tab-btn">Debts</a>
      <a href="admin.html" class="tab-btn tab-btn-icon" aria-label="Admin" title="Admin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
    </nav>
    <div class="user-bar">
      <span id="user-email"></span>
      <button id="signout-btn">Sign out</button>
    </div>
  </header>

  <div class="stat-row" id="stat-row-total"></div>
  <div class="stat-row" id="stat-row-accounts"></div>

  <div class="card">
    <div class="card-header">
      <h2>Accounts</h2>
    </div>
    <div class="accounts-grid" id="accounts-grid"></div>
  </div>

  <div class="card">
    <h2>Update a value</h2>
    <div class="tabs" id="value-tabs">
      <button type="button" class="tab-btn active" data-tab="Savings">Savings</button>
      <button type="button" class="tab-btn" data-tab="Investments">Investments</button>
    </div>

    <div class="tab-panel" data-tab-panel="Savings">
      <div class="field tab-date-field">
        <label for="date-Savings">Date</label>
        <input id="date-Savings" type="date">
      </div>
      <div class="value-rows" id="rows-Savings"></div>
      <button type="button" class="primary save-tab-btn" data-tab="Savings">Save</button>
      <div class="msg" id="msg-Savings"></div>
    </div>

    <div class="tab-panel hidden" data-tab-panel="Investments">
      <div class="field tab-date-field">
        <label for="date-Investments">Date</label>
        <input id="date-Investments" type="date">
      </div>
      <div class="value-row-header">
        <span class="value-row-header-name"></span>
        <span>Value</span>
        <span>Contribution</span>
      </div>
      <div class="value-rows" id="rows-Investments"></div>
      <button type="button" class="primary save-tab-btn" data-tab="Investments">Save</button>
      <div class="msg" id="msg-Investments"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>12 Month Performance</h2>
      <span id="performance-current" class="performance-current"></span>
    </div>
    <div id="performance-chart-wrap">
      <svg id="performance-chart" viewBox="0 0 760 260" preserveAspectRatio="none"></svg>
      <div class="legend" id="performance-legend"></div>
    </div>
    <div id="performance-empty" class="empty hidden">Not enough history yet to show 12 month performance.</div>
  </div>

  <div class="card">
    <h2>Shares</h2>
    <div class="expense-list-header">
      <span class="expense-date">Code</span>
      <span class="expense-name"></span>
      <span class="expense-amount">Quantity</span>
      <span class="share-price">Price</span>
      <span class="expense-running-total">Value</span>
      <span class="share-update-btn"></span>
    </div>
    <div class="expense-list" id="shares-grid"></div>
    <div class="month-total" id="shares-total"></div>
  </div>

</div>

<div id="share-modal" class="modal-overlay hidden">
  <div class="modal card">
    <h2 id="share-modal-title">Add share</h2>
    <form id="share-form">
      <div class="field">
        <label for="new-share-title">Title</label>
        <input id="new-share-title" type="text" placeholder="e.g. Apple Inc." required>
      </div>
      <div class="field">
        <label for="new-share-code">Trading code</label>
        <input id="new-share-code" type="text" placeholder="e.g. AAPL" required>
      </div>
      <div class="field">
        <label for="new-share-quantity">Quantity</label>
        <input id="new-share-quantity" type="number" step="0.0001" min="0" placeholder="0" required>
      </div>
      <div class="field">
        <label for="new-share-price">Price (£)</label>
        <input id="new-share-price" type="number" step="0.0001" min="0" placeholder="0.00">
      </div>
      <div class="modal-actions">
        <button type="button" class="danger hidden" id="share-modal-delete">Delete</button>
        <button type="button" id="share-modal-cancel">Cancel</button>
        <button type="submit" class="primary" id="share-modal-submit">Add share</button>
      </div>
    </form>
  </div>
</div>


<script>
  function showFatal(msg) {
    var el = document.getElementById('fatal-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  window.addEventListener('error', function (e) {
    showFatal('Something failed to load or run: ' + e.message + ' (' + (e.filename || '') + (e.lineno ? ':' + e.lineno : '') + ')');
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showFatal('Failed to load the Supabase library from cdn.jsdelivr.net — check your internet connection or whether an ad/script blocker is active.')"></script>
<script src="config.js" onerror="showFatal('Failed to load config.js')"></script>
<script src="app.js" onerror="showFatal('Failed to load app.js')"></script>
</body>
</html>
